name: Keep Render service warm

on:
  schedule:
    # Render's free web services spin down after 15 minutes without inbound traffic.
    # GitHub Actions schedules can be delayed, so this reduces (but cannot eliminate)
    # cold starts.
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Request the dashboard
        run: >-
          curl --fail --silent --show-error --location
          --max-time 60
          --output /dev/null
          --write-out 'HTTP %{http_code} in %{time_total}s\n'
          https://dq-react-dashboard.onrender.com/overview
